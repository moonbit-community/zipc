name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install MoonBit (nightly)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show MoonBit version and update dependencies
        run: |
          moon version --all
          moonrun --version
          moon update

      - name: Check, format, and verify public interfaces
        shell: bash
        run: |
          moon check --target all --warn-list +73 --deny-warn
          moon info
          moon fmt
          git diff --exit-code
          untracked_mbti="$(git ls-files --others --exclude-standard -- pkg.generated.mbti ':(glob)**/pkg.generated.mbti')"
          if [ -n "$untracked_mbti" ]; then
            echo "moon info generated untracked interface files:"
            printf '%s\n' "$untracked_mbti"
            exit 1
          fi

      - name: Test every backend in debug and release modes
        env:
          OCAMLRUNPARAM: b
        run: |
          moon test --target wasm
          moon test --target wasm --release
          moon test --target wasm-gc
          moon test --target wasm-gc --release
          moon test --target js
          moon test --target js --release
          moon test --target native
          moon test --target native --release
